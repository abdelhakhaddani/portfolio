name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auto-generate projects.json from image folders
        run: |
          python3 << 'EOF'
          import os, json

          img_dir = 'assets/img'
          projects = []

          # Folders that get the featured hero-card treatment
          FEATURED = {'Details-Plans-and-Drafts'}

          # Junk folders to skip entirely
          SKIP = {'JPEG', 'New folder'}

          # Scan every subfolder inside assets/img/
          for folder_name in sorted(os.listdir(img_dir)):
              folder_path = os.path.join(img_dir, folder_name)
              if not os.path.isdir(folder_path):
                  continue  # skip files like logo.svg, favicon.svg
              if folder_name in SKIP:
                  continue  # skip junk folders

              # Collect all image files, sorted by name (case-insensitive extension match)
              images = sorted([
                  f for f in os.listdir(folder_path)
                  if f.lower().endswith(('.jpg', '.jpeg', '.png', '.webp', '.gif'))
              ])

              if not images:
                  continue  # skip empty folders

              entry = {
                  'title':  folder_name,
                  'folder': folder_name,
                  'images': images,
                  'cover':  images[0]
              }
              if folder_name in FEATURED:
                  entry['featured'] = True
              projects.append(entry)

          # Ensure featured projects always appear first
          projects.sort(key=lambda p: (0 if p.get('featured') else 1, p['title']))

          os.makedirs('assets/data', exist_ok=True)
          with open('assets/data/projects.json', 'w') as f:
              json.dump(projects, f, indent=2, ensure_ascii=False)

          print(f'✅ Generated {len(projects)} projects:')
          for p in projects:
              print(f'   {p["title"]} — {len(p["images"])} image(s)')
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
