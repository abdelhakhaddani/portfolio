<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Isometric building mark — outer silhouette -->
  <!-- Top face -->
  <path d="M50 5 L87 26 L50 47 L13 26 Z"
        stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
  <!-- Left face -->
  <path d="M13 26 L50 47 L50 93 L13 72 Z"
        stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
  <!-- Right face -->
  <path d="M87 26 L87 72 L50 93 L50 47 Z"
        stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
  <!-- Center vertical ridge -->
  <line x1="50" y1="47" x2="50" y2="93" stroke="currentColor" stroke-width="2"/>
  <!-- Floor level lines at 1/3 and 2/3 height -->
  <polyline points="13,41 50,62 87,41" stroke="currentColor" stroke-width="1" fill="none" stroke-linejoin="round"/>
  <polyline points="13,57 50,78 87,57" stroke="currentColor" stroke-width="1" fill="none" stroke-linejoin="round"/>
</svg>
